startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - HPC_HOST
      - HPC_USER
      - SLURM_ACCOUNT
    properties:
      HPC_HOST:
        type: string
        description: SSH host alias or hostname for your HPC cluster
      HPC_USER:
        type: string
        description: Your username on the HPC cluster
      SLURM_ACCOUNT:
        type: string
        description: SLURM account/allocation for job submission
      HPC_PREAMBLE:
        type: string
        description: Shell commands to run before job scripts (module loads, conda activate, etc.)
      SLURM_DEFAULT_PARTITION:
        type: string
        description: Default partition for slurm_submit (default batch)
      SLURM_DEFAULT_GPUS:
        type: string
        description: "Default GPU count for slurm_submit (default 1). Sites without GPUs: set SLURM_DEFAULT_GPUS=0"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'slurm-mcp-server'],
      env: {
        HPC_HOST: config.HPC_HOST,
        HPC_USER: config.HPC_USER,
        SLURM_ACCOUNT: config.SLURM_ACCOUNT,
        ...(config.HPC_PREAMBLE ? { HPC_PREAMBLE: config.HPC_PREAMBLE } : {}),
        ...(config.SLURM_DEFAULT_PARTITION ? { SLURM_DEFAULT_PARTITION: config.SLURM_DEFAULT_PARTITION } : {}),
        ...(config.SLURM_DEFAULT_GPUS ? { SLURM_DEFAULT_GPUS: String(config.SLURM_DEFAULT_GPUS) } : {})
      }
    })
